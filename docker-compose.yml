services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medivision-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medivision-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
